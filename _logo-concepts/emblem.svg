<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Personal emblem: sunrise over Mount Fuji with a journey path and a trilingual reflection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0"   stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1"   stop-color="#fb7185"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="232"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="239" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="2"/>

  <g clip-path="url(#disc)">
    <!-- Rising sun: Japan, the land of the rising sun, and a new dawn -->
    <circle cx="256" cy="232" r="150" fill="url(#halo)"/>
    <circle cx="256" cy="236" r="92" fill="url(#sun)"/>

    <!-- The journey: a dashed path winding up from afar to the summit -->
    <path d="M70,372 C150,360 150,300 210,280 C250,266 250,232 256,190"
          fill="none" stroke="#fde68a" stroke-opacity="0.85"
          stroke-width="7" stroke-linecap="round" stroke-dasharray="2 20"/>

    <!-- Mount Fuji: the home found in Japan, calm and aspirational -->
    <path d="M96,376 C150,300 200,236 256,176 C312,236 362,300 416,376 Z" fill="url(#mtn)"/>
    <!-- snow cap with the classic uneven hem -->
    <path d="M219,238 Q236,228 246,236 Q256,226 266,236 Q276,228 293,238 L256,176 Z"
          fill="#f8fafc" fill-opacity="0.96"/>

    <!-- Reflection on water = three languages (Arabic · Japanese · English) -->
    <line x1="150" y1="404" x2="362" y2="404" stroke="#22d3ee" stroke-opacity="0.9"  stroke-width="9" stroke-linecap="round"/>
    <line x1="178" y1="426" x2="334" y2="426" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <line x1="206" y1="446" x2="306" y2="446" stroke="#22d3ee" stroke-opacity="0.30" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
