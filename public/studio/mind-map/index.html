<style>
  :root{
    --page-bg:#090b10;
    --bg-grad:
      radial-gradient(46% 42% at 50% 40%, rgba(233,194,122,.13), transparent 60%),
      radial-gradient(44% 40% at 16% 14%, rgba(150,120,230,.13), transparent 62%),
      radial-gradient(46% 42% at 86% 16%, rgba(60,190,190,.09), transparent 62%),
      radial-gradient(92% 82% at 50% 118%, rgba(9,11,18,.75), transparent 60%),
      linear-gradient(170deg,#0a0c12 0%,#0c0f16 48%,#08090e 100%);
    --ink:#f1ecf8;--ink-soft:#c1bad1;--muted:#8c85a0;
    --panel:rgba(24,27,36,.68);--panel-solid:rgba(17,19,27,.96);--panel-brd:rgba(233,194,122,.24);
    --card-grad:linear-gradient(180deg,rgba(46,50,64,.62),rgba(24,27,38,.62));
    --nc-brd:56%;
    --node-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 16px 36px -12px rgba(0,0,0,.75);
    --sel-plate:rgba(233,194,122,.18);--ring:#e9c27a;
    --btn-grad:linear-gradient(135deg,#f4d99e,#d9a441);--btn-ink:#2a1e06;--btn-shadow:0 10px 24px -6px rgba(217,164,65,.5);
    --chip:#e9c27a;--input-bg:rgba(255,255,255,.05);--input-bg-focus:rgba(255,255,255,.09);--kbd-bg:rgba(233,194,122,.12);
    --ok:#4ade9e;
    --tap:44px;
    --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
    --f-head:"El Messiri","Tajawal","Segoe UI",serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  :root[data-mm-theme="light"]{
    --page-bg:#faf8ff;
    --bg-grad:
      radial-gradient(42% 40% at 22% 18%, rgba(150,120,240,.20), transparent 62%),
      radial-gradient(40% 42% at 82% 20%, rgba(90,175,225,.16), transparent 62%),
      radial-gradient(52% 48% at 50% 108%, rgba(90,190,140,.18), transparent 60%),
      linear-gradient(170deg,#faf8ff 0%,#f4f4fb 46%,#eef6f0 100%);
    --ink:#332c4b;--ink-soft:#5a5473;--muted:#6d6683;
    --panel:rgba(255,255,255,.72);--panel-solid:rgba(255,255,255,.95);--panel-brd:rgba(120,108,158,.2);
    --card-grad:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,255,255,.72));
    --nc-brd:42%;
    --node-shadow:0 1px 1px rgba(255,255,255,.9) inset, 0 12px 28px -14px rgba(80,60,130,.4);
    --sel-plate:rgba(122,90,240,.14);--ring:#7a5af0;
    --btn-grad:linear-gradient(135deg,#8a6bf2,#6472e0);--btn-ink:#fff;--btn-shadow:0 10px 24px -6px rgba(110,90,230,.5);
    --chip:#3fa87c;--input-bg:rgba(255,255,255,.7);--input-bg-focus:#fff;--kbd-bg:rgba(120,108,158,.12);
    --ok:#2f9e6c;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--page-bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
    overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent;transition:background .5s var(--ease)}
  :focus-visible{outline:2.5px solid var(--ring);outline-offset:2px;border-radius:8px}

  #stage{position:fixed;inset:0;overflow:hidden}
  #stage::before{content:"";position:absolute;inset:-15%;z-index:0;background:var(--bg-grad);transition:background .5s var(--ease)}
  #motes{position:absolute;inset:0;z-index:1;pointer-events:none}
  #canvas{position:absolute;inset:0;z-index:2;touch-action:none;cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  #viewport{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:-8000px;top:-8000px;width:16000px;height:16000px;overflow:visible;pointer-events:none;transition:opacity .25s}
  #links.dim{opacity:.14}
  #nodes{position:absolute;left:0;top:0}
  #veil{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .7s var(--ease);
    background:radial-gradient(58% 52% at 50% 46%, transparent 38%, rgba(4,5,9,.66) 100%)}
  #stage.focusing #veil{opacity:1;animation:veilpulse 8s ease-in-out infinite}
  @keyframes veilpulse{0%,100%{opacity:.8}50%{opacity:1}}
  #stage.focusing .node:not(.dim) .node-body{animation:breathe 8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  #stage.moving .node-body,#stage.linking .node-body{cursor:copy}

  .node{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:250px;--nc:#b79cff;user-select:none;transition:opacity .25s,filter .25s}
  .node.core{max-width:none}
  .node.dim{opacity:.14;filter:saturate(.5)}
  .node.dragging{z-index:20}
  .node-body{
    position:relative;display:flex;align-items:center;gap:9px;padding:11px 17px;border-radius:16px;max-width:248px;min-height:42px;
    color:var(--ink);font-size:15.5px;font-weight:500;line-height:1.45;background:var(--card-grad);
    border:1px solid color-mix(in srgb,var(--nc) var(--nc-brd),transparent);
    box-shadow:var(--node-shadow), 0 0 24px -8px color-mix(in srgb,var(--nc) 72%,transparent);
    backdrop-filter:blur(9px);cursor:grab;transition:box-shadow .28s var(--ease),border-color .28s var(--ease),transform .22s var(--ease),opacity .25s;
  }
  .node-body::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:radial-gradient(130% 130% at 10% 0%, color-mix(in srgb,var(--nc) 18%,transparent), transparent 55%)}
  .node:hover .node-body{transform:translateY(-2px)}
  .node.sel .node-body{border-color:color-mix(in srgb,var(--nc) 84%,transparent);
    box-shadow:0 0 0 3px var(--sel-plate), var(--node-shadow), 0 0 34px -6px color-mix(in srgb,var(--nc) 85%,transparent)}
  .node.match .node-body{border-color:var(--ring);box-shadow:0 0 0 2.5px var(--ring), var(--node-shadow), 0 0 30px -4px color-mix(in srgb,var(--nc) 85%,transparent)}

  let lang="ar";

  const lsDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };

  let state, nodes;

  // ---- maps registry ----
  let reg;
  function loadRegistry(){
    try{ reg=JSON.parse(lsGet(REG_KEY)||""); }catch(e){ reg=null; }
    if(!reg||!Array.isArray(reg.list)||!reg.list.length){
      reg={list:[{id:"m1",name:lang==="ar"?"خريطتي":"My map"}],cur:"m1"};
      const legacy=lsGet(LEGACY_KEY);
      if(legacy&&!lsGet("mm-map:m1")) lsSet("mm-map:m1",legacy);
      saveRegistry();
    }
    if(!reg.list.find(m=>m.id===reg.cur)) reg.cur=reg.list[0].id;
  }
  function saveRegistry(){ lsSet(REG_KEY,JSON.stringify(reg)); }
  const dataKey=()=>"mm-map:"+reg.cur;

  function blankState(){
    return {rootId:"root",seq:1,selected:"root",themeVersion:THEME,core:"lineart",coreImage:null,xlinks:[],nodes:{
      root:{id:"root",text:t("seedRoot"),parent:null,children:[],color:null,mx:null,my:null,collapsed:false}}};
  }
  function seed(tmplIdx){
    state=blankState(); nodes=state.nodes;
    const trees=t("tmplTrees");
    const list=(tmplIdx!=null&&trees[tmplIdx])?trees[tmplIdx]:trees[1];
    list.forEach(x=>addNode("root",x,true));
  }
  function retheme(){ nodes[state.rootId].children.forEach((cid,i)=>{ const col=PALETTE[i%PALETTE.length];
    collectSubtree(cid,[]).forEach(g=>nodes[g].color=col); }); }
  function migrate(){
    if(!Array.isArray(state.xlinks)) state.xlinks=[];
    // شيل أي رابط بيشاور على فكرة اتمسحت
    state.xlinks=state.xlinks.filter(p=>Array.isArray(p)&&p.length===2&&nodes[p[0]]&&nodes[p[1]]);
    Object.keys(nodes).forEach(id=>{ const n=nodes[id];
      if(n.note===undefined) n.note="";
      if(n.done===undefined) n.done=false;
      if(n.icon===undefined) n.icon="";
    });
  }
  function load(){
    try{ const raw=lsGet(dataKey());
      if(raw){ state=JSON.parse(raw); nodes=state.nodes;
        if(!nodes||!state.rootId) throw 0;
        if(!state.selected||!nodes[state.selected]) state.selected=state.rootId;
        if(state.themeVersion!==THEME){ retheme(); state.themeVersion=THEME; }
        if(!state.core) state.core="lineart";
        migrate(); return; } }catch(e){}
    seed();
  }
  let saveT;
  function save(){ clearTimeout(saveT); saveT=setTimeout(flushSave,250); }
  function flushSave(){ clearTimeout(saveT); lsSet(dataKey(),JSON.stringify(state)); }

  // history
  function pushHistory(){ undoStack.push(JSON.stringify(state)); if(undoStack.length>60) undoStack.shift(); redoStack=[]; updateHistBtns(); }
  function restore(json){
    state=JSON.parse(json); nodes=state.nodes; migrate();
    if(!nodes[state.selected]) state.selected=state.rootId;
    Object.keys(els).forEach(k=>{els[k].remove();delete els[k];});
    Object.keys(currentPos).forEach(k=>delete currentPos[k]);
    currentPos[state.rootId]={x:0,y:0};
    computeLayout(); syncNodes();
    Object.keys(targetPos).forEach(id=>{ if(!currentPos[id]) currentPos[id]=Object.assign({},targetPos[id]); });
    paint(); select(state.selected); updateEmpty(); save(); updateHistBtns();
  }
  function undo(){ if(!undoStack.length) return; redoStack.push(JSON.stringify(state)); restore(undoStack.pop()); toast(t("toastUndo")); }
  function redo(){ if(!redoStack.length) return; undoStack.push(JSON.stringify(state)); restore(redoStack.pop()); toast(t("toastRedo")); }
  function updateHistBtns(){ $("btnUndo").disabled=!undoStack.length; $("btnRedo").disabled=!redoStack.length; }

  // CRUD
  function addNode(parentId,text,silent){
    const p=nodes[parentId]; if(!p) return null;
    if(!silent) pushHistory();
    const id="n"+(state.seq++);
    let color=parentId===state.rootId?PALETTE[p.children.length%PALETTE.length]:(p.color||PALETTE[0]);
    nodes[id]={id,text:text||t("newIdea"),parent:parentId,children:[],color,mx:null,my:null,
      collapsed:false,note:"",done:false,icon:"",createdAt:Date.now()};
    p.children.push(id); if(p.collapsed) p.collapsed=false;
    const pp=currentPos[parentId]||{x:0,y:0}; currentPos[id]={x:pp.x,y:pp.y};
    if(!silent){ changed(); select(id); bornFx(id); } return id;
  }
  function bornFx(id){ const el=els[id]; if(!el||REDUCE) return; el.classList.add("born"); setTimeout(()=>el.classList.remove("born"),560); }
  function collectSubtree(id,out){ out.push(id); nodes[id].children.forEach(c=>collectSubtree(c,out)); return out; }
  function delNode(id){
    if(id===state.rootId) return; pushHistory();
    const n=nodes[id], p=nodes[n.parent];
    if(p){ const i=p.children.indexOf(id); if(i>=0) p.children.splice(i,1); }
    const gone=collectSubtree(id,[]);
    gone.forEach(g=>{ delete nodes[g]; delete currentPos[g]; delete targetPos[g]; if(els[g]){els[g].remove();delete els[g];}
      if(g===state.selected) state.selected=n.parent||state.rootId; });
    state.xlinks=(state.xlinks||[]).filter(pr=>!gone.includes(pr[0])&&!gone.includes(pr[1]));
    changed(); select(state.selected);
  }
  function setBranchColor(id,hex){ let cur=nodes[id];
    while(cur&&cur.parent&&cur.parent!==state.rootId) cur=nodes[cur.parent];
    if(!cur||cur.parent===null) return; pushHistory();
    collectSubtree(cur.id,[]).forEach(g=>nodes[g].color=hex); syncNodes(); paint(); save(); }
  function quickAdd(parentId){ const nid=addNode(parentId,t("newIdea")); if(nid) setTimeout(()=>startEdit(nid),30); }
  function toggleDone(id){ const n=nodes[id]; if(!n||id===state.rootId) return;
    pushHistory(); n.done=!n.done; syncNodes(); paint(); save(); toast(n.done?t("toastDone"):t("toastUndone")); }
  function setIcon(id,em){ const n=nodes[id]; if(!n) return;
    if((n.icon||"")===em) return; pushHistory(); n.icon=em; syncNodes(); save(); }

  // ---- reparent (نقل) ----
  let moveMode=null, linkMode=null;
  function showModeBar(text,name){ $("modeText").textContent=text; $("modeName").textContent=name; $("modeBar").classList.add("show"); }
  function startMove(id){
    if(id===state.rootId) return; cancelLink();
    moveMode=id; showModeBar(t("moveHint"),"«"+nodes[id].text+"» · "+t("escCancel"));
    $("stage").classList.add("moving"); closePanels(); closePopovers();
  }
  function cancelMove(){ moveMode=null; $("stage").classList.remove("moving"); if(!linkMode) $("modeBar").classList.remove("show"); }
  function canReparent(id,targetId){
    if(!id||!nodes[id]||!nodes[targetId]) return false;
    if(targetId===id||collectSubtree(id,[]).includes(targetId)) return false;
    return true;
  }
  function reparent(id,targetId,skipHistory){
    if(!skipHistory) pushHistory();
    const n=nodes[id], oldP=nodes[n.parent];
    if(oldP){ const i=oldP.children.indexOf(id); if(i>=0) oldP.children.splice(i,1); }
    n.parent=targetId; nodes[targetId].children.push(id);
    if(nodes[targetId].collapsed) nodes[targetId].collapsed=false;
    const col=targetId===state.rootId?PALETTE[(nodes[targetId].children.length-1)%PALETTE.length]:nodes[targetId].color;
    collectSubtree(id,[]).forEach(g=>{ nodes[g].color=col; nodes[g].mx=null; nodes[g].my=null; });
    changed(); select(id);
  }
  function doMove(targetId){
    const id=moveMode; cancelMove();
    if(!id||!nodes[id]||!nodes[targetId]) return;
    if(!canReparent(id,targetId)){ toast(t("toastMoveSelf")); return; }
    if(nodes[id].parent===targetId){ toast(t("toastMoveSame")); return; }
    reparent(id,targetId); toast(t("toastMoved"));
  }

  // ---- cross links (ربط) ----
  function startLink(id){
    if(id===state.rootId) return; cancelMove();
    linkMode=id; showModeBar(t("linkHint"),"«"+nodes[id].text+"» · "+t("escCancel"));
    $("stage").classList.add("linking"); closePanels(); closePopovers();
  }
  function cancelLink(){ linkMode=null; $("stage").classList.remove("linking"); if(!moveMode) $("modeBar").classList.remove("show"); }
  function doLink(targetId){
    const id=linkMode; cancelLink();
    if(!id||!nodes[id]||!nodes[targetId]) return;
    if(targetId===id||targetId===state.rootId){ toast(t("toastLinkSelf")); return; }
    if(!state.xlinks) state.xlinks=[];
    const i=state.xlinks.findIndex(p=>(p[0]===id&&p[1]===targetId)||(p[0]===targetId&&p[1]===id));
    pushHistory();
    if(i>=0){ state.xlinks.splice(i,1); toast(t("toastUnlinked")); }
    else { state.xlinks.push([id,targetId]); toast(t("toastLinked")); }
    paint(); save();
  }

  // layout
  function radiusFor(d){
    if(d<=0) return 0;
    const kids=nodes[state.rootId].children.length;
    return Math.max(305, kids*27) + (d-1)*210;
  }
  function computeLayout(){
    const leaves={};
    (function count(id){ const n=nodes[id]; const ch=n.collapsed?[]:n.children;
      if(!ch.length){leaves[id]=1;return 1;} let s=0; ch.forEach(c=>s+=count(c)); leaves[id]=s; return s; })(state.rootId);
    (function assign(id,a0,a1,d){ const n=nodes[id]; const mid=(a0+a1)/2; const r=radiusFor(d); n._depth=d;
      targetPos[id]=(n.mx!=null&&n.my!=null)?{x:n.mx,y:n.my}:{x:Math.cos(mid)*r,y:Math.sin(mid)*r};
      const ch=n.collapsed?[]:n.children; let a=a0; const tot=leaves[id];
      ch.forEach(c=>{ const span=(a1-a0)*(leaves[c]/tot); assign(c,a,a+span,d+1); a+=span; }); })(state.rootId,-Math.PI/2,Math.PI*1.5,0);
  }

  let raf=null;
  function changed(){ computeLayout(); syncNodes(); animate(); updateEmpty(); save(); if(focusing) applyFocusClasses(); }
  function animate(){
    const ids=Object.keys(targetPos);
    ids.forEach(id=>{ if(!currentPos[id]){ const p=nodes[id]?nodes[id].parent:null; currentPos[id]=Object.assign({},currentPos[p]||{x:0,y:0}); } });
    if(REDUCE){ ids.forEach(id=>currentPos[id]=Object.assign({},targetPos[id])); paint(); return; }
    const from={}; ids.forEach(id=>from[id]=Object.assign({},currentPos[id]));
    const t0=performance.now(), dur=520; cancelAnimationFrame(raf);
    (function step(now){ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      ids.forEach(id=>{ const f=from[id],tp=targetPos[id]; if(!f||!tp) return; currentPos[id]={x:f.x+(tp.x-f.x)*e,y:f.y+(tp.y-f.y)*e}; });
      paint(); if(k<1) raf=requestAnimationFrame(step); })(t0);
  }

  const IC={

  function buildNode(n){
    const isCore=n.id===state.rootId;
    const el=document.createElement("div"); el.className="node"+(isCore?" core":""); el.dataset.id=n.id;
    const lb=k=>{ const s=t(k); return 'aria-label="'+s+'" title="'+s+'"'; };
    if(isCore){
      el.innerHTML='<div class="tools"><button class="tool add" '+lb("tAdd")+'>'+IC.plus+'</button></div>'+
        '<div class="tree-wrap">'+coreSVG()+'</div>';
    }else{
      el.innerHTML='<div class="tools"><button class="tool add" '+lb("tAdd")+'>'+IC.plus+'</button>'+
        '<button class="tool edit" '+lb("tEdit")+'>'+IC.pencil+'</button>'+
        '<button class="tool done" '+lb("tDone")+'>'+IC.check+'</button>'+
        '<button class="tool note" '+lb("tNote")+'>'+IC.note+'</button>'+
        '<button class="tool emoji" '+lb("tEmoji")+'>'+IC.smile+'</button>'+
        '<button class="tool color" '+lb("tColor")+'><span class="cdot"></span></button>'+
        '<button class="tool link" '+lb("tLink")+'>'+IC.chain+'</button>'+
        '<button class="tool move" '+lb("tMove")+'>'+IC.move+'</button>'+
        '<button class="tool del" '+lb("tDel")+'>'+IC.x+'</button></div>'+
        '<div class="node-body"><span class="dot"></span><span class="n-emoji"></span>'+
        '<span class="label" dir="auto"></span><span class="prog"></span>'+
        '<span class="note-ic" title="'+t("tHasNote")+'">'+IC.note+'</span></div>'+
        '<button class="collapse" '+lb("tCollapse")+'>•</button>';
    }
    const q=s=>el.querySelector(s);
    q(".tool.add").addEventListener("click",e=>{ e.stopPropagation(); quickAdd(n.id); });
    const edBtn=q(".tool.edit"); if(edBtn) edBtn.addEventListener("click",e=>{ e.stopPropagation(); startEdit(n.id); });
    if(!isCore){
      q(".tool.done").addEventListener("click",e=>{ e.stopPropagation(); toggleDone(n.id); });
      q(".tool.note").addEventListener("click",e=>{ e.stopPropagation(); openNote(n.id); });
      q(".tool.emoji").addEventListener("click",e=>{ e.stopPropagation(); openEmoji(n.id,el); });
      q(".tool.color").addEventListener("click",e=>{ e.stopPropagation(); openPopover(n.id,el); });
      q(".tool.link").addEventListener("click",e=>{ e.stopPropagation(); startLink(n.id); });
      q(".tool.move").addEventListener("click",e=>{ e.stopPropagation(); startMove(n.id); });
      q(".tool.del").addEventListener("click",e=>{ e.stopPropagation(); confirmDelete(n.id); });
      q(".collapse").addEventListener("click",e=>{ e.stopPropagation(); pushHistory(); n.collapsed=!n.collapsed; changed(); });
    }
    el.addEventListener("dblclick",e=>{ e.stopPropagation(); if(!isCore) startEdit(n.id); });
    return el;
  }

  let freshMode=false;
  // لازم ترجّع boolean صريح: classList.toggle بيتجاهل الـ force لو كان undefined
  // فبيقلب الكلاس بدل ما يشيله (الجذر مفيهوش createdAt فكان بيرفرف)
  function isFresh(n){ return !!(freshMode && n.createdAt && (Date.now()-n.createdAt)<DAY); }
  function syncNodes(){
    Object.keys(els).forEach(id=>{ if(!nodes[id]){ els[id].remove(); delete els[id]; } });
    Object.keys(nodes).forEach(id=>{ const n=nodes[id]; let el=els[id];
      if(!el){ el=buildNode(n); els[id]=el; nodesLayer.appendChild(el); }
      const isCore=id===state.rootId;
      el.style.setProperty("--nc", n.color||"#b79cff");
      el.classList.toggle("sel", state.selected===id);
      el.classList.toggle("has-kids", n.children.length>0 && !isCore);
      el.classList.toggle("collapsed", !!n.collapsed);
      el.classList.toggle("has-note", !!(n.note&&n.note.trim()));
      el.classList.toggle("done", !!n.done);
      el.classList.toggle("fresh", isFresh(n));
      el.style.display=isHiddenByCollapse(id)?"none":"";
      if(!isCore){
        const lab=el.querySelector(".label");
        if(lab && !lab.classList.contains("editing") && lab.textContent!==n.text) lab.textContent=n.text;
        const em=el.querySelector(".n-emoji");
        el.classList.toggle("has-emoji", !!n.icon);
        if(em && em.textContent!==(n.icon||"")) em.textContent=n.icon||"";
        // عدّاد التقدّم على الفكرة اللي ليها أبناء
        const kids=n.children; const doneN=kids.filter(c=>nodes[c]&&nodes[c].done).length;
        const showProg=kids.length>0 && doneN>0;
        el.classList.toggle("has-prog",showProg);
        el.classList.toggle("all-done",showProg&&doneN===kids.length);
        if(showProg) el.querySelector(".prog").textContent=doneN+"/"+kids.length;
      }
    });
    updateTarget();
  }

  let focusing=false, focusSet=null;
  function paint(){
    Object.keys(els).forEach(id=>{ const p=currentPos[id]; if(!p) return; const el=els[id]; el.style.left=p.x+"px"; el.style.top=p.y+"px"; });
    const LO=8000; let d="";
    Object.keys(nodes).forEach(id=>{ const n=nodes[id]; if(n.parent==null||isHiddenByCollapse(id)) return;
      const A=currentPos[n.parent], B=currentPos[id]; if(!A||!B) return;
      let ax=A.x+LO, ay=A.y+LO; const bx=B.x+LO, by=B.y+LO;
      if(n.parent===state.rootId){ const a0=Math.atan2(by-ay,bx-ax); ax+=Math.cos(a0)*CORE_R; ay+=Math.sin(a0)*CORE_R; }
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1, bow=Math.min(54,len*0.14);
      const mx=(ax+bx)/2+(-dy/len)*bow, my=(ay+by)/2+(dx/len)*bow;
      const col=n.color||"#b79cff", w=Math.max(3,6-(n._depth||1)*0.9);
      let k=(focusing&&focusSet&&!focusSet.has(id))?0.12:1;
      if(n.done) k*=0.4;
      const path=`M${ax.toFixed(1)} ${ay.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
      d+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="${(w+7).toFixed(1)}" stroke-opacity="${(0.20*k).toFixed(3)}" stroke-linecap="round"/>`+
         `<path d="${path}" fill="none" stroke="${col}" stroke-width="${w.toFixed(1)}" stroke-opacity="${(0.92*k).toFixed(3)}" stroke-linecap="round"/>`;
    });
    // الروابط العرضية بين الفروع — خط منقّط
    (state.xlinks||[]).forEach(pr=>{
      const a=nodes[pr[0]], b=nodes[pr[1]]; if(!a||!b) return;
      if(isHiddenByCollapse(pr[0])||isHiddenByCollapse(pr[1])) return;
      const A=currentPos[pr[0]], B=currentPos[pr[1]]; if(!A||!B) return;
      const ax=A.x+LO, ay=A.y+LO, bx=B.x+LO, by=B.y+LO;
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1, bow=Math.min(120,len*0.3);
      const mx=(ax+bx)/2+(-dy/len)*bow, my=(ay+by)/2+(dx/len)*bow;
      let k=1; if(focusing&&focusSet&&(!focusSet.has(pr[0])||!focusSet.has(pr[1]))) k=0.12;
      d+=`<path d="M${ax.toFixed(1)} ${ay.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}" fill="none" `+
         `stroke="${a.color||"#b79cff"}" stroke-width="2.2" stroke-opacity="${(0.7*k).toFixed(3)}" stroke-dasharray="2 8" stroke-linecap="round"/>`;
    });
    linksSvg.innerHTML=d;
  }
  function isHiddenByCollapse(id){ let c=nodes[id].parent; while(c!=null){ if(nodes[c].collapsed) return true; c=nodes[c].parent; } return false; }

  // focus / breathing
  function computeFocusSet(){
    const s=new Set(); const sel=state.selected;
    if(!sel||sel===state.rootId||!nodes[sel]) return null;
    let branch=nodes[sel];
    while(branch.parent&&branch.parent!==state.rootId) branch=nodes[branch.parent];
    collectSubtree(branch.id,[]).forEach(g=>s.add(g));
    s.add(state.rootId);
    return s;
  }
  function applyFocusClasses(){
    focusSet=computeFocusSet();
    Object.keys(els).forEach(id=>els[id].classList.toggle("dim", focusing&&focusSet&&!focusSet.has(id)));
    paint();
  }
  function toggleFocus(on){
    const want=(on!=null)?on:!focusing;
    if(want){
      if(!state.selected||state.selected===state.rootId){ toast(t("toastFocusPick")); return; }
      focusing=true; $("stage").classList.add("focusing"); $("btnFocus").classList.add("on");
      applyFocusClasses(); toast(t("toastFocusOn"));
    }else{
      focusing=false; focusSet=null; $("stage").classList.remove("focusing"); $("btnFocus").classList.remove("on");
      Object.keys(els).forEach(id=>els[id].classList.remove("dim")); paint();
    }
  }

  function startEdit(id){
    const el=els[id]; if(!el||id===state.rootId) return;
    const lab=el.querySelector(".label");
    if(!lab||lab.classList.contains("editing")) return;
    select(id); lab.classList.add("editing"); lab.contentEditable="true"; lab.focus();
    const r=document.createRange(); r.selectNodeContents(lab); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    const old=nodes[id].text;
    const finish=commit=>{ lab.contentEditable="false"; lab.classList.remove("editing");
      lab.removeEventListener("keydown",onKey); lab.removeEventListener("blur",onBlur);
      if(commit){ const v=lab.textContent.trim()||"…"; if(v!==old){ pushHistory(); nodes[id].text=v; } }
      lab.textContent=nodes[id].text; updateTarget(); save(); };
    const onKey=e=>{ if(e.key==="Enter"){e.preventDefault();lab.blur();} else if(e.key==="Escape"){e.preventDefault();finish(false);} };
    const onBlur=()=>finish(true);
    lab.addEventListener("keydown",onKey); lab.addEventListener("blur",onBlur);
  }

  function select(id){ if(!nodes[id]) id=state.rootId; state.selected=id;
    Object.keys(els).forEach(k=>els[k].classList.toggle("sel",k===id)); updateTarget(); save();
    if(focusing){ if(id===state.rootId) toggleFocus(false); else applyFocusClasses(); } }
  function updateTarget(){ const n=nodes[state.selected]||nodes[state.rootId];

  function navDir(dx,dy){
    const cur=currentPos[state.selected]; if(!cur) return;
    let best=null,bestScore=1e18;
    Object.keys(nodes).forEach(id=>{
      if(id===state.selected||isHiddenByCollapse(id)) return;
      const p=currentPos[id]; if(!p) return;
      const vx=p.x-cur.x, vy=p.y-cur.y;
      const proj=vx*dx+vy*dy; if(proj<=10) return;
      const perp=Math.abs(vx*dy-vy*dx);
      const score=proj+perp*2.2;
      if(score<bestScore){ bestScore=score; best=id; }
    });

  }

  const canvas=$("canvas"), viewport=$("viewport");
  function applyView(){ viewport.style.transform=`translate(${view.panX}px,${view.panY}px) scale(${view.zoom})`; }
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function zoomAt(cx,cy,f){ const nz=clamp(view.zoom*f,.2,2.4); const wx=(cx-view.panX)/view.zoom, wy=(cy-view.panY)/view.zoom;

  function fit(){ const ids=Object.keys(nodes); if(!ids.length) return;
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    ids.forEach(id=>{ if(isHiddenByCollapse(id)) return; const p=currentPos[id]||targetPos[id]; if(!p) return;
      minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y); });

  canvas.addEventListener("pointerdown",e=>{

    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    // ملاحظة: setPointerCapture بيرمي NotFoundError في حالات معيّنة — لو وقع من غير حماية
    // الهاندلر كله بيقع ومفيش اختيار ولا سحب ولا تحريك خالص

    else { gesture={type:"pan",sx:e.clientX,sy:e.clientY,px:view.panX,py:view.panY}; canvas.classList.add("grabbing"); closePopovers(); }
  });

        const w=worldOf(e.clientX,e.clientY), c=currentPos[gesture.id]; gesture.offX=w.x-c.x; gesture.offY=w.y-c.y; }
      if(gesture.moved){

  function startPinch(){ const p=[...pointers.values()]; pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2,z:view.zoom}; }

  const tidy=()=>{ pushHistory(); Object.values(nodes).forEach(n=>{n.mx=null;n.my=null;}); changed(); setTimeout(fit,540); toast(t("toastTidy")); };
  $("btnTidy").onclick=tidy;
  $("btnFocus").onclick=()=>toggleFocus();
  $("btnMore").onclick=()=>togglePanel("menu");
  $("mFit").onclick=()=>{ hideMenu(); fit(); };
  $("mTidy").onclick=()=>{ hideMenu(); tidy(); };
  $("mFocus").onclick=()=>{ hideMenu(); toggleFocus(); };
  $("mCollapseAll").onclick=()=>{ hideMenu(); pushHistory();
    Object.keys(nodes).forEach(id=>{ if(id!==state.rootId&&nodes[id].children.length) nodes[id].collapsed=true; });
    changed(); setTimeout(fit,540); toast(t("toastCollapsed")); };
  $("mExpandAll").onclick=()=>{ hideMenu(); pushHistory();
    Object.keys(nodes).forEach(id=>{ nodes[id].collapsed=false; });
    changed(); setTimeout(fit,540); toast(t("toastExpanded")); };
  $("mFresh").onclick=()=>{ hideMenu(); freshMode=!freshMode;
    $("mFresh").classList.toggle("on",freshMode); syncNodes();
    if(freshMode){ const n=Object.values(nodes).filter(x=>x.id!==state.rootId&&isFresh(x)).length; toast(t("toastFreshOn",n)); }
    else toast(t("toastFreshOff")); };
  $("btnHelp").onclick=()=>togglePanel("help");

  function download(name,mime,content){
    const blob=new Blob([content],{type:mime});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }
  const stamp=()=>new Date().toISOString().slice(0,10);
  function markBackup(){ lsSet("mm-lastBackup",String(Date.now())); $("backupBar").classList.remove("show"); }
  $("btnExport").onclick=()=>{ closePanels();
    download(t("fileName")+"-"+stamp()+".json","application/json",JSON.stringify(state,null,2));
    markBackup(); toast(t("toastJson")); };
  $("btnMd").onclick=()=>{ closePanels();
    const mapName=(reg.list.find(m=>m.id===reg.cur)||{}).name||t("title");
    let out="# "+mapName+"\n\n";
    (function walk(id,depth){
      nodes[id].children.forEach(cid=>{
        const n=nodes[cid];
        const pad="  ".repeat(depth);
        const mark=n.done?"[x]":"[ ]";
        out+=pad+"- "+mark+" "+(n.icon?n.icon+" ":"")+n.text+"\n";
        if(n.note&&n.note.trim()){
          n.note.trim().split(/\n/).forEach(line=>{ out+=pad+"  > "+line+"\n"; });
        }
        walk(cid,depth+1);
      });
    })(state.rootId,0);
    download(t("fileName")+"-"+stamp()+".md","text/markdown;charset=utf-8",out);
    toast(t("toastMd")); };
  $("btnImport").onclick=()=>{ closePanels(); $("fileIn").click(); };
  $("fileIn").addEventListener("change",function(){ const f=this.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const s=JSON.parse(rd.result); if(!s.nodes||!s.rootId) throw 0; pushHistory(); state=s; nodes=state.nodes;
      if(!nodes[state.selected]) state.selected=state.rootId; if(state.themeVersion!==THEME){ retheme(); state.themeVersion=THEME; }
      migrate();
      Object.keys(els).forEach(k=>{els[k].remove();delete els[k];}); Object.keys(currentPos).forEach(k=>delete currentPos[k]);
      currentPos[state.rootId]={x:0,y:0}; changed(); select(state.selected); setTimeout(fit,540); toast(t("toastLoaded"));
    }catch(e){ toast(t("toastBadFile")); } this.value=""; }; rd.readAsText(f); });
  $("btnClear").onclick=async()=>{ closePanels();
    const ok=await ask(t("askClear"),{yes:t("yesClear")});
    if(!ok) return;
    pushHistory(); Object.keys(els).forEach(k=>{els[k].remove();delete els[k];}); Object.keys(currentPos).forEach(k=>delete currentPos[k]);
    seed(0); currentPos["root"]={x:0,y:0}; changed(); select("root");
    view.zoom=1; view.panX=innerWidth/2; view.panY=innerHeight/2; applyView(); setTimeout(fit,560); toast(t("toastCleared")); };
  $("backupNow").onclick=()=>$("btnExport").click();
  $("backupDismiss").onclick=()=>{ markBackup(); };
  $("storageDismiss").onclick=()=>$("storageBar").classList.remove("show");

  // PNG export
  function roundRect(x2,x,y,w,h,r){ x2.beginPath(); x2.moveTo(x+r,y); x2.arcTo(x+w,y,x+w,y+h,r); x2.arcTo(x+w,y+h,x,y+h,r); x2.arcTo(x,y+h,x,y,r); x2.arcTo(x,y,x+w,y,r); x2.closePath(); }
  function wrapText(x2,text,maxW){
    const words=text.split(/\s+/), lines=[]; let line="";
    words.forEach(w=>{ const tx=line?line+" "+w:w;
      if(x2.measureText(tx).width>maxW&&line){ lines.push(line); line=w; } else line=tx; });
    if(line) lines.push(line); return lines;
  }
  async function exportPNG(){
    closePanels(); toast(t("toastPngWait"));
    const light=document.documentElement.getAttribute("data-mm-theme")==="light";
    const rtl=I18N[lang]._dir==="rtl";
    const ids=Object.keys(nodes).filter(id=>!isHiddenByCollapse(id)&&currentPos[id]);
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    ids.forEach(id=>{ const p=currentPos[id]; const el=els[id]; if(!el) return;
      const bd=el.querySelector(id===state.rootId?".tree-wrap":".node-body");
      const hw=(bd?bd.offsetWidth:120)/2, hh=(bd?bd.offsetHeight:42)/2;
      minX=Math.min(minX,p.x-hw); maxX=Math.max(maxX,p.x+hw); minY=Math.min(minY,p.y-hh); maxY=Math.max(maxY,p.y+hh); });
    const pad=130, W=(maxX-minX)+pad*2, H=(maxY-minY)+pad*2;
    let S=2; if(Math.max(W,H)*S>8000) S=Math.max(1,8000/Math.max(W,H));
    const cv=document.createElement("canvas"); cv.width=Math.round(W*S); cv.height=Math.round(H*S);
    const x2=cv.getContext("2d"); x2.scale(S,S);
    x2.fillStyle=light?"#f6f4fc":"#0a0c12"; x2.fillRect(0,0,W,H);
    const gcx=-minX+pad, gcy=-minY+pad;
    const gl=x2.createRadialGradient(gcx,gcy,60,gcx,gcy,Math.max(W,H)*0.55);
    gl.addColorStop(0,light?"rgba(150,120,240,.12)":"rgba(233,194,122,.10)"); gl.addColorStop(1,"rgba(0,0,0,0)");
    x2.fillStyle=gl; x2.fillRect(0,0,W,H);
    x2.translate(-minX+pad,-minY+pad);
    ids.forEach(id=>{ const n=nodes[id]; if(!n||n.parent==null) return;
      const A=currentPos[n.parent], B=currentPos[id]; if(!A||!B) return;
      let ax=A.x, ay=A.y; const bx=B.x, by=B.y;
      if(n.parent===state.rootId){ const a0=Math.atan2(by-ay,bx-ax); ax+=Math.cos(a0)*CORE_R; ay+=Math.sin(a0)*CORE_R; }
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1, bow=Math.min(54,len*0.14);
      const mx=(ax+bx)/2+(-dy/len)*bow, my=(ay+by)/2+(dx/len)*bow;
      const col=n.color||"#b79cff", w=Math.max(3,6-(n._depth||1)*0.9);
      const k=n.done?0.4:1;
      [[w+7,0.20*k],[w,0.92*k]].forEach(pair=>{
        x2.beginPath(); x2.moveTo(ax,ay); x2.quadraticCurveTo(mx,my,bx,by);
        x2.strokeStyle=col; x2.globalAlpha=pair[1]; x2.lineWidth=pair[0]; x2.lineCap="round"; x2.stroke(); });
      x2.globalAlpha=1; });
    // cross links
    (state.xlinks||[]).forEach(pr=>{
      if(!nodes[pr[0]]||!nodes[pr[1]]) return;
      if(isHiddenByCollapse(pr[0])||isHiddenByCollapse(pr[1])) return;
      const A=currentPos[pr[0]], B=currentPos[pr[1]]; if(!A||!B) return;
      const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, bow=Math.min(120,len*0.3);
      const mx=(A.x+B.x)/2+(-dy/len)*bow, my=(A.y+B.y)/2+(dx/len)*bow;
      x2.save(); x2.setLineDash([2,8]); x2.strokeStyle=nodes[pr[0]].color||"#b79cff";
      x2.globalAlpha=.7; x2.lineWidth=2.2; x2.lineCap="round";
      x2.beginPath(); x2.moveTo(A.x,A.y); x2.quadraticCurveTo(mx,my,B.x,B.y); x2.stroke(); x2.restore(); });
    const coreEl=els[state.rootId]&&els[state.rootId].querySelector("svg.tree");
    if(coreEl){
      try{
        let svgStr=coreEl.outerHTML;
        if(!/xmlns=/.test(svgStr)) svgStr=svgStr.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" ');
        const img=new Image();
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej;
          img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr); });
        const p=currentPos[state.rootId]; x2.drawImage(img,p.x-120,p.y-120,240,240);
      }catch(e){ const p=currentPos[state.rootId];
        x2.beginPath(); x2.arc(p.x,p.y,60,0,6.283); x2.fillStyle="rgba(233,194,122,.25)"; x2.fill(); }
    }
    x2.textAlign="center"; x2.textBaseline="middle";
    try{ x2.direction=rtl?"rtl":"ltr"; }catch(e){}
    ids.forEach(id=>{ if(id===state.rootId) return; const n=nodes[id], p=currentPos[id], el=els[id]; if(!el) return;
      const bd=el.querySelector(".node-body"); const w=bd?bd.offsetWidth:140, h=bd?bd.offsetHeight:42;
      const col=n.color||"#b79cff";
      x2.save();
      if(n.done) x2.globalAlpha=.6;
      x2.shadowColor=col; x2.shadowBlur=18;
      x2.fillStyle=light?"rgba(255,255,255,.97)":"#20242f";
      roundRect(x2,p.x-w/2,p.y-h/2,w,h,15); x2.fill();
      x2.shadowBlur=0;
      x2.strokeStyle=n.done?"#7fbf9c":col; x2.globalAlpha=(n.done?.4:(light?.55:.7)); x2.lineWidth=1.4; x2.stroke();
      x2.globalAlpha=n.done?.62:1;
      const dotX=rtl?(p.x+w/2-15):(p.x-w/2+15);
      x2.beginPath(); x2.arc(dotX,p.y,4.5,0,6.283); x2.fillStyle=n.done?"#4ade9e":col; x2.fill();
      x2.fillStyle=light?"#332c4b":"#f1ecf8"; x2.font='500 14.5px Tajawal, sans-serif';
      const label=(n.icon?n.icon+" ":"")+n.text;
      const lines=wrapText(x2,label,w-46);
      const lh=19, y0=p.y-(lines.length-1)*lh/2;
      const textX=rtl?(p.x-6):(p.x+6);
      lines.forEach((ln,i)=>x2.fillText(ln,textX,y0+i*lh));
      if(n.done){ // شطبة على النص
        const wMax=Math.max(...lines.map(ln=>x2.measureText(ln).width));
        x2.strokeStyle=light?"#332c4b":"#f1ecf8"; x2.globalAlpha=.5; x2.lineWidth=1.4;
        x2.beginPath(); x2.moveTo(textX-wMax/2,p.y); x2.lineTo(textX+wMax/2,p.y); x2.stroke(); }
      x2.restore(); });
    x2.setTransform(S,0,0,S,0,0);
    x2.font='700 15px "El Messiri", Tajawal, serif'; x2.textAlign="left"; x2.direction="ltr";
    x2.fillStyle=light?"rgba(122,90,240,.5)":"rgba(233,194,122,.55)";
    x2.fillText(t("watermark"),14,H-16);
    cv.toBlob(b=>{
      if(!b){ toast(t("toastPngFail")); return; }
      const a=document.createElement("a"); a.href=URL.createObjectURL(b);
      a.download=t("fileName")+"-"+stamp()+".png"; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast(t("toastPngDone"));
    },"image/png");
  }
  $("btnPng").onclick=()=>{ exportPNG(); };

  // PWA install
  let deferredPrompt=null;
  try{
    const manifest={name:"خريطة عقلي · My Mind Map",short_name:"خريطة عقلي",start_url:location.href,
      display:"standalone",background_color:"#090b10",theme_color:"#090b10",dir:"rtl",lang:"ar",
      icons:[{src:FAV.href,sizes:"any",type:"image/svg+xml",purpose:"any"}]};
    const mlink=document.createElement("link"); mlink.rel="manifest";
    mlink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    document.head.appendChild(mlink);
  }catch(e){}
  addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; $("btnInstall").hidden=false; });
  $("btnInstall").onclick=async()=>{ hideMenu(); if(!deferredPrompt) return;
    deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){}
    deferredPrompt=null; $("btnInstall").hidden=true; };

  // keyboard
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      if(modal.classList.contains("show")){ settleModal(false); return; }
      if(notePanel.classList.contains("show")){ closeNote(); return; }
      if(moveMode){ cancelMove(); return; }
      if(linkMode){ cancelLink(); return; }
      if(focusing){ toggleFocus(false); return; }
      closePopovers(); closePanels(); return;
    }
    // ملاحظة: e.target ممكن يكون document نفسه (مفيش عليه closest) — لازم الحارس ده
    const tg=e.target;
    if(tg===idea||tg===searchIn||(tg&&tg.closest&&tg.closest("input,textarea,[contenteditable='true'],.editing"))
       ||modal.classList.contains("show")||notePanel.classList.contains("show")) return;
    const mod=e.ctrlKey||e.metaKey;
    if(mod && (e.key==="z"||e.key==="Z")){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if(mod && (e.key==="y"||e.key==="Y")){ e.preventDefault(); redo(); return; }
    if(mod) return;
    if(e.key==="/"){ e.preventDefault(); openSearch(); return; }
    const sel=state.selected; if(!sel||!nodes[sel]) return;
    if(e.key==="Tab"){ e.preventDefault(); quickAdd(sel); }
    else if(e.key==="Enter"){ e.preventDefault(); quickAdd(nodes[sel].parent||sel); }
    else if(e.key===" "||e.key==="F2"){ e.preventDefault(); startEdit(sel); }
    else if(e.key==="Delete"){ if(sel!==state.rootId){ e.preventDefault(); confirmDelete(sel); } }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); navDir(-1,0); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); navDir(1,0); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); navDir(0,-1); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); navDir(0,1); }
  });
  async function confirmDelete(id){ const n=nodes[id]; if(!n) return;
    const kids=collectSubtree(id,[]).length-1;
    if(kids>0){ const ok=await ask(t("askDelete",n.text,kids),{yes:t("yesDelete")}); if(!ok) return; }
    delNode(id); toast(t("toastDeleted"),{action:t("undoAction"),fn:undo}); }

  // toast (بزرار تراجع اختياري)
  let toastT; const toastEl=$("toast"), toastMsg=$("toastMsg"), toastBtn=$("toastBtn");
  function toast(msg,opts){
    toastMsg.textContent=msg;
    if(opts&&opts.action){ toastBtn.textContent=opts.action; toastBtn.classList.add("show");
      toastBtn.onclick=()=>{ toastEl.classList.remove("show"); toastBtn.classList.remove("show"); clearTimeout(toastT); opts.fn(); }; }
    else { toastBtn.classList.remove("show"); toastBtn.onclick=null; }
    toastEl.classList.add("show"); clearTimeout(toastT);
    toastT=setTimeout(()=>{ toastEl.classList.remove("show"); toastBtn.classList.remove("show"); },opts&&opts.action?4200:1900);
  }

  // motes
  const mc=$("motes"), m2=mc.getContext("2d"); let motes=[];
  function sizeMotes(){ const dpr=Math.min(2,devicePixelRatio||1); mc.width=innerWidth*dpr; mc.height=innerHeight*dpr; m2.setTransform(dpr,0,0,dpr,0,0); }
  function initMotes(){ motes=[]; const n=Math.round(Math.min(50,innerWidth*innerHeight/38000));
    for(let i=0;i<n;i++) motes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.6,a:Math.random()*.4+.12,vy:Math.random()*.1+.02,vx:(Math.random()-.5)*.05,tw:Math.random()*6.28}); }
  const MC=["#e9c27a","#b79cff","#5cc7c0","#ff9ec0"];
  function drawMotes(){ m2.clearRect(0,0,innerWidth,innerHeight);
    for(let i=0;i<motes.length;i++){ const p=motes[i]; p.y-=p.vy; p.x+=p.vx; p.tw+=0.01;
      if(p.y<-6){p.y=innerHeight+6;p.x=Math.random()*innerWidth;}
      const a=p.a*(0.6+0.4*Math.sin(p.tw)); m2.beginPath(); m2.arc(p.x,p.y,p.r,0,6.283); m2.fillStyle=MC[i%MC.length]; m2.globalAlpha=a; m2.fill(); }
    m2.globalAlpha=1; if(!REDUCE) requestAnimationFrame(drawMotes); }

  function checkBackupNudge(){
    if(!storageOK) return;
    const last=parseInt(lsGet("mm-lastBackup")||"0",10);
    const ideas=Object.keys(nodes).length-1;
    if(ideas<8) return;
    if(!last){ lsSet("mm-lastBackup",String(Date.now())); return; }
    if(Date.now()-last>7*DAY) $("backupBar").classList.add("show");
  }

  function init(){
    const saved=lsGet("mm-lang");
    lang=(saved==="ar"||saved==="en")?saved:"ar";
    applyTheme(theme);
    loadRegistry();
    load(); currentPos[state.rootId]={x:0,y:0};
    sizeMotes(); initMotes(); if(REDUCE) drawMotes(); else requestAnimationFrame(drawMotes);
    computeLayout(); syncNodes();
    Object.keys(targetPos).forEach(id=>currentPos[id]=Object.assign({},targetPos[id]));
    applyLang();
    Object.keys(targetPos).forEach(id=>{ if(!currentPos[id]) currentPos[id]=Object.assign({},targetPos[id]); });
    paint(); select(state.selected); updateEmpty(); applyView(); updateHistBtns(); setTimeout(fit,60);
    if(!storageOK) $("storageBar").classList.add("show");
    checkBackupNudge();
  }
  addEventListener("resize",()=>{ sizeMotes(); if(REDUCE) drawMotes(); });
  init();
})();
</script>
